version: '3.8'

services:
  dgraph:
    image: dgraph/standalone:latest
    container_name: dgraph-orly-test
    ports:
      - "8080:8080"  # HTTP API
      - "9080:9080"  # gRPC
      - "8000:8000"  # Ratel UI
    volumes:
      - dgraph-data:/dgraph
    environment:
      - DGRAPH_ALPHA_JAEGER_COLLECTOR=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  dgraph-data:
    driver: local
